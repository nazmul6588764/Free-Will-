<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Fire World</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: url('https://envs.sh/1cb.jpg/IMG20251017782.jpg') no-repeat center center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.6);
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
    }

    h1 {
      font-size: 2.5em;
      font-weight: 700;
      color: #ffcc00;
      text-shadow: 2px 2px 8px #000;
    }

    p {
      font-size: 1.3em;
      margin-top: 10px;
      color: #e0e0e0;
      text-shadow: 1px 1px 4px #000;
    }

    .uid-box {
      margin-top: 30px;
      background: rgba(255, 255, 255, 0.1);
      padding: 15px 25px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(6px);
    }

    #uid {
      font-size: 1.8em;
      color: #ff8800;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    #copy-message {
      color: #00ff99;
      font-size: 0.9em;
      margin-top: 5px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .btn {
      background: linear-gradient(90deg, #ff5500, #ff8800);
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      color: white;
      font-size: 1em;
      cursor: pointer;
      margin-top: 25px;
      transition: 0.3s;
      box-shadow: 0 0 10px rgba(255, 136, 0, 0.6);
    }

    .btn:hover {
      transform: scale(1.05);
      background: linear-gradient(90deg, #ff7700, #ffaa33);
    }

    .back-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
      transition: 0.3s;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="overlay">
    <button class="back-btn" onclick="goBack()">⬅ Back</button>

    <h1>Hello!</h1>
    <p>Welcome to Free Fire World</p>

    <div class="uid-box">
      <p>My UID:</p>
      <div id="uid" onclick="copyUID()">6763548917</div>
      <div id="copy-message">UID Copied!</div>
    </div>

    <button class="btn" onclick="startFreeFire()">🎮 Start to Free Fire</button>
  </div>

  <script>
    function goBack() {
      // এখানে তোমার ব্যাক লিংক বসাও
      window.location.href = "https://nazmul6588764.github.io/About-of-stark/";
    }

    function startFreeFire() {
      // যদি ফোনে Free Fire ইন্সটল থাকে তাহলে ওপেন হবে
      window.location.href = "intent://com.dts.freefireth/#Intent;scheme=android-app;end";
    }

    function copyUID() {
      const uid = document.getElementById("uid").textContent;
      navigator.clipboard.writeText(uid).then(() => {
        const msg = document.getElementById("copy-message");
        msg.style.opacity = 1;
        setTimeout(() => {
          msg.style.opacity = 0;
        }, 2000);
      });
    }
  </script>
</body>
</html>
